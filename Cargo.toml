[workspace]
resolver = "2"
members = [
    "crates/fw-analyze",
    "crates/fw-extract",
    "crates/tr-format",
    "crates/tr-studio",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Avery Wagar"]
repository = "https://github.com/ajmwagar/cowbell"
rust-version = "1.74"

# Shared dependency versions so the two CLIs stay in lockstep.
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
